<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>R book - Secure Memories</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d3536" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, #0d3836 0%, #08222b 40%, #04121a 100%);
      --card-bg: rgba(18, 48, 56, 0.65);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-red: #ff334b;
      --accent-teal: #00d2aa;
      --accent-blue: #00a8ff;
      --accent-gold: #ffb830;
      --text-main: #f1f7f9;
      --text-sub: #9eb5be;
      --radius-xl: 24px;
      --radius-md: 16px;
      --shadow-soft: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    .brand-logo { display: inline-flex; align-items: baseline; font-weight: 800; user-select: none; }
    .brand-logo .r-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%;
      box-shadow: 0 4px 15px rgba(255, 51, 75, 0.25); margin-right: 8px;
    }
    .brand-logo .r-char { font-family: 'Playfair Display', serif; color: var(--accent-red); font-size: 2.2rem; line-height: 1; }
    .brand-logo .book-text { font-size: 1.15rem; color: #ffffff; letter-spacing: -0.5px; text-transform: lowercase; font-weight: 700; }

    .header-bar {
      position: sticky; top: 0; z-index: 40;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; background: rgba(8, 34, 43, 0.85);
      backdrop-filter: blur(16px); border-bottom: 1px solid var(--card-border);
    }
    .user-pill {
      background: rgba(255, 255, 255, 0.08); padding: 6px 14px;
      border-radius: 99px; border: 1px solid var(--card-border);
      font-size: 0.85rem; display: flex; align-items: center; gap: 10px;
    }
    .btn-logout {
      background: rgba(255, 51, 75, 0.15); color: #ff8593; border: 1px solid rgba(255, 51, 75, 0.3);
      padding: 4px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem;
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px; flex: 1; }

    .grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
    .cat-btn {
      background: var(--card-bg); border: 2px solid var(--card-border);
      border-radius: var(--radius-xl); padding: 18px 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(10px);
      box-shadow: var(--shadow-soft); text-align: center;
    }
    .cat-btn.active { border-color: var(--accent-teal); background: rgba(0, 210, 170, 0.15); transform: translateY(-2px); }
    .cat-btn .icon { font-size: 1.8rem; margin-bottom: 6px; }
    .cat-btn .title { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; }
    .cat-btn .count-tag {
      font-size: 0.75rem; font-weight: 600; color: #fff;
      background: rgba(255, 255, 255, 0.12); padding: 2px 8px; border-radius: 99px;
    }
    .cat-personal.active { border-color: var(--accent-red); background: rgba(255, 51, 75, 0.12); }
    .cat-family.active { border-color: var(--accent-teal); background: rgba(0, 210, 170, 0.12); }
    .cat-old.active { border-color: var(--accent-gold); background: rgba(255, 184, 48, 0.12); }
    .cat-new.active { border-color: var(--accent-blue); background: rgba(0, 168, 255, 0.12); }

    .view-all-pill {
      grid-column: span 2; padding: 10px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      color: var(--text-sub); font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center;
    }
    .view-all-pill.active { background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.3); }

    .action-row { display: flex; gap: 12px; margin-bottom: 24px; }
    .search-input {
      flex: 1; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-md); padding: 12px 18px; color: #fff; outline: none; font-size: 0.9rem;
    }
    .btn-add {
      background: linear-gradient(135deg, var(--accent-teal), #009982);
      color: #03211c; border: none; border-radius: var(--radius-md);
      padding: 0 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    .photo-masonry { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .photo-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-xl); overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer; transition: transform 0.2s ease;
    }
    .photo-card:hover { transform: translateY(-3px); }
    .photo-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .photo-meta { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .photo-tag { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag-personal { color: var(--accent-red); }
    .tag-family { color: var(--accent-teal); }
    .tag-old { color: var(--accent-gold); }
    .tag-new { color: var(--accent-blue); }
    .photo-note { font-size: 0.82rem; color: #d0e1e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
      z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: #0d2c33; border: 1px solid var(--card-border);
      border-radius: var(--radius-xl); max-width: 440px; width: 100%; padding: 24px;
      box-shadow: var(--shadow-soft); max-height: 90vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 1.3rem; margin-bottom: 18px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600; }
    .form-control {
      width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 12px; color: #fff; outline: none; font-size: 0.9rem;
    }
    .form-control option { background: #08222b; color: #fff; }

    .upload-source-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .upload-tab {
      flex: 1; text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 600;
      background: rgba(255, 255, 255, 0.06); border-radius: 8px; cursor: pointer; border: 1px solid transparent;
    }
    .upload-tab.active { background: rgba(0, 210, 170, 0.15); border-color: var(--accent-teal); color: var(--accent-teal); }
    .btn-submit {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-teal), #009982);
      border: none; border-radius: 12px; color: #03211c; font-weight: 700; cursor: pointer;
    }
    .btn-close {
      width: 100%; padding: 12px; background: transparent; border: 1px solid var(--card-border);
      border-radius: 12px; color: var(--text-sub); font-weight: 600; margin-top: 8px; cursor: pointer;
    }

    #authScreen {
      position: fixed; inset: 0; background: var(--bg-gradient); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-xl); max-width: 400px; width: 100%; padding: 32px 24px;
      backdrop-filter: blur(20px); text-align: center; box-shadow: var(--shadow-soft);
    }
    .auth-tabs { display: flex; gap: 8px; margin: 20px 0; background: rgba(0, 0, 0, 0.2); padding: 4px; border-radius: 12px; }
    .auth-tab { flex: 1; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
    .auth-tab.active { background: rgba(255, 255, 255, 0.1); color: #fff; }

    #lightboxModal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 150;
      display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    #lightboxModal img { max-width: 100%; max-height: 70vh; border-radius: 16px; object-fit: contain; }
    .lightbox-details { margin-top: 16px; text-align: center; max-width: 500px; }
  </style>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAmGn4U1js7nnt-RKv7Pj_iOjxdpcJe-AI",
      authDomain: "rbook-e1732.firebaseapp.com",
      projectId: "rbook-e1732",
      storageBucket: "rbook-e1732.firebasestorage.app",
      messagingSenderId: "668762894733",
      appId: "1:668762894733:web:128b46232461b9ba00cdc4",
      measurementId: "G-6FNLKFDVLP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let photosList = [];
    let selectedFilter = 'all';
    let activeUploadSource = 'device';
    let currentLightboxPhoto = null;

    // Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Auth Observer
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const authScreen = document.getElementById('authScreen');
      const appInterface = document.getElementById('appInterface');
      const userDisplay = document.getElementById('userEmailDisplay');

      if (user) {
        authScreen.style.display = 'none';
        appInterface.style.display = 'block';
        userDisplay.textContent = user.email;
        listenToPhotos(user.uid);
      } else {
        authScreen.style.display = 'flex';
        appInterface.style.display = 'none';
        photosList = [];
        renderPhotos();
      }
    });

    // Auth Functions
    window.handleAuthAction = async () => {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value.trim();
      const isSignUp = document.getElementById('tabSignUp').classList.contains('active');
      const btn = document.getElementById('authSubmitBtn');

      if (!email || pass.length < 6) {
        alert("Please enter a valid email and minimum 6-character password.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = isSignUp ? "Create Vault Account" : "Open Vault";
      }
    };

    window.switchAuthTab = (type) => {
      document.getElementById('tabSignIn').classList.toggle('active', type === 'in');
      document.getElementById('tabSignUp').classList.toggle('active', type === 'up');
      document.getElementById('authSubmitBtn').textContent = type === 'up' ? "Create Vault Account" : "Open Vault";
    };

    window.logoutApp = () => signOut(auth);

    // Realtime Firestore Listener
    function listenToPhotos(uid) {
      const q = query(
        collection(db, "rbook_photos"),
        where("userId", "==", uid),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        photosList = [];
        snapshot.forEach((doc) => {
          photosList.push({ id: doc.id, ...doc.data() });
        });
        updateCounts();
        renderPhotos();
      }, (error) => {
        console.error("Firestore Listen error:", error);
      });
    }

    function updateCounts() {
      const counts = { personal: 0, family: 0, old: 0, new: 0 };
      photosList.forEach(p => { if (counts[p.category] !== undefined) counts[p.category]++; });
      document.getElementById('countPersonal').textContent = counts.personal;
      document.getElementById('countFamily').textContent = counts.family;
      document.getElementById('countOld').textContent = counts.old;
      document.getElementById('countNew').textContent = counts.new;
    }

    window.setFilter = (category) => {
      selectedFilter = category;
      document.querySelectorAll('.cat-btn, .view-all-pill').forEach(el => el.classList.remove('active'));
      if (category === 'all') {
        document.getElementById('btnFilterAll').classList.add('active');
      } else {
        document.getElementById(`btnCat_${category}`).classList.add('active');
      }
      renderPhotos();
    };

    window.renderPhotos = () => {
      const container = document.getElementById('photosContainer');
      const searchWord = document.getElementById('searchBar').value.toLowerCase();
      container.innerHTML = '';

      const filtered = photosList.filter(item => {
        const matchesCat = (selectedFilter === 'all' || item.category === selectedFilter);
        const matchesSearch = !searchWord || (item.note && item.note.toLowerCase().includes(searchWord));
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub);">
          No memories found in this gallery yet.
        </div>`;
        return;
      }

      filtered.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${photo.imageData}" loading="lazy" alt="Memory" />
          <div class="photo-meta">
            <span class="photo-tag tag-${photo.category}">${photo.category}</span>
            <div class="photo-note">${photo.note || 'No notes added'}</div>
          </div>
        `;
        card.onclick = () => openLightbox(photo);
        container.appendChild(card);
      });
    };

    // Upload & Image Compression
    window.setUploadSource = (src) => {
      activeUploadSource = src;
      ['device', 'camera', 'cloud'].forEach(s => {
        document.getElementById(`tabSrc_${s}`).classList.toggle('active', s === src);
        document.getElementById(`inputWrap_${s}`).style.display = (s === src) ? 'block' : 'none';
      });
    };

    function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    window.saveNewPhoto = async () => {
      if (!currentUser) return;
      const category = document.getElementById('modalCategory').value;
      const note = document.getElementById('modalNote').value.trim();
      const btn = document.getElementById('btnSaveMemory');

      let finalDataUrl = '';

      if (activeUploadSource === 'cloud') {
        finalDataUrl = document.getElementById('inputCloudUrl').value.trim();
        if (!finalDataUrl) { alert("Please enter image URL"); return; }
      } else {
        const input = document.getElementById(activeUploadSource === 'camera' ? 'inputCameraFile' : 'inputDeviceFile');
        if (!input.files || !input.files[0]) { alert("Please pick an image first"); return; }
        btn.disabled = true;
        btn.textContent = "Compressing...";
        try {
          finalDataUrl = await compressImage(input.files[0]);
        } catch (e) {
          alert("Image processing failed.");
          btn.disabled = false;
          btn.textContent = "Save to Gallery";
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        await addDoc(collection(db, "rbook_photos"), {
          userId: currentUser.uid,
          category: category,
          note: note,
          imageData: finalDataUrl,
          createdAt: serverTimestamp()
        });

        closeModal();
        document.getElementById('inputDeviceFile').value = '';
        document.getElementById('inputCameraFile').value = '';
        document.getElementById('inputCloudUrl').value = '';
        document.getElementById('modalNote').value = '';
      } catch (e) {
        alert("Error saving: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save to Gallery";
      }
    };

    // Modal & Lightbox Helpers
    window.openUploadModal = () => document.getElementById('uploadModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('uploadModal').style.display = 'none';

    function openLightbox(photo) {
      currentLightboxPhoto = photo;
      document.getElementById('lightboxImg').src = photo.imageData;
      document.getElementById('lightboxTag').className = `photo-tag tag-${photo.category}`;
      document.getElementById('lightboxTag').textContent = photo.category;
      document.getElementById('lightboxNote').textContent = photo.note || "No notes attached.";
      document.getElementById('lightboxModal').style.display = 'flex';
    }

    window.closeLightbox = () => {
      document.getElementById('lightboxModal').style.display = 'none';
      currentLightboxPhoto = null;
    };

    window.deleteCurrentPhoto = async () => {
      if (!currentLightboxPhoto || !confirm("Are you sure you want to delete this memory permanently?")) return;
      try {
        await deleteDoc(doc(db, "rbook_photos", currentLightboxPhoto.id));
        closeLightbox();
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    };
  </script>
</head>
<body>

  <!-- Sign In / Sign Up Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <div class="brand-logo" style="margin-bottom: 8px;">
        <span class="r-badge"><span class="r-char">R</span></span>
        <span class="book-text" style="font-size: 1.6rem;">book</span>
      </div>
      <p style="color: var(--text-sub); font-size: 0.85rem;">Private Memory Vault</p>

      <div class="auth-tabs">
        <div id="tabSignIn" class="auth-tab active" onclick="switchAuthTab('in')">Sign In</div>
        <div id="tabSignUp" class="auth-tab" onclick="switchAuthTab('up')">Sign Up</div>
      </div>

      <div class="form-group" style="text-align: left;">
        <label>Email Address</label>
        <input type="email" id="authEmail" class="form-control" placeholder="name@example.com" />
      </div>

      <div class="form-group" style="text-align: left;">
        <label>Password (Min. 6 characters)</label>
        <input type="password" id="authPass" class="form-control" placeholder="••••••••" />
      </div>

      <button id="authSubmitBtn" class="btn-submit" onclick="handleAuthAction()" style="margin-top: 10px;">Open Vault</button>
    </div>
  </div>

  <!-- Main Authenticated App -->
  <div id="appInterface" style="display: none;">
    <header class="header-bar">
      <div class="brand-logo">
        <span class="r-badge"><span class="r-char">R</span></span>
        <span class="book-text">book</span>
      </div>
      <div class="user-pill">
        <span id="userEmailDisplay">user@mail.com</span>
        <button class="btn-logout" onclick="logoutApp()">Sign Out</button>
      </div>
    </header>

    <main class="container">
      <!-- 2x2 Rounded Gallery Grid Layout -->
      <div class="grid-2x2">
        <!-- Top Left: Personal -->
        <div id="btnCat_personal" class="cat-btn cat-personal" onclick="setFilter('personal')">
          <div class="icon">🔒</div>
          <div class="title">Personal</div>
          <span class="count-tag" id="countPersonal">0</span>
        </div>

        <!-- Top Right: Family -->
        <div id="btnCat_family" class="cat-btn cat-family" onclick="setFilter('family')">
          <div class="icon">🏡</div>
          <div class="title">Family</div>
          <span class="count-tag" id="countFamily">0</span>
        </div>

        <!-- Bottom Left: Old -->
        <div id="btnCat_old" class="cat-btn cat-old" onclick="setFilter('old')">
          <div class="icon">⏳</div>
          <div class="title">Old</div>
          <span class="count-tag" id="countOld">0</span>
        </div>

        <!-- Bottom Right: New -->
        <div id="btnCat_new" class="cat-btn cat-new" onclick="setFilter('new')">
          <div class="icon">✨</div>
          <div class="title">New</div>
          <span class="count-tag" id="countNew">0</span>
        </div>

        <!-- View All Photos Pill -->
        <div id="btnFilterAll" class="view-all-pill active" onclick="setFilter('all')">
          View All Photos
        </div>
      </div>

      <!-- Search & Add Actions -->
      <div class="action-row">
        <input type="text" id="searchBar" class="search-input" placeholder="Search notes..." oninput="renderPhotos()" />
        <button class="btn-add" onclick="openUploadModal()">
          <span>+</span> Add Photo
        </button>
      </div>

      <!-- Photo Display Area -->
      <div class="photo-masonry" id="photosContainer"></div>
    </main>
  </div>

  <!-- Add Photo Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-box">
      <h2>Add New Memory</h2>

      <div class="form-group">
        <label>Select Target Gallery</label>
        <select id="modalCategory" class="form-control">
          <option value="personal">Personal Gallery</option>
          <option value="family">Family Gallery</option>
          <option value="old">Old Gallery</option>
          <option value="new">New Gallery</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload Source</label>
        <div class="upload-source-tabs">
          <div id="tabSrc_device" class="upload-tab active" onclick="setUploadSource('device')">Gallery</div>
          <div id="tabSrc_camera" class="upload-tab" onclick="setUploadSource('camera')">Camera</div>
          <div id="tabSrc_cloud" class="upload-tab" onclick="setUploadSource('cloud')">Link</div>
        </div>

        <div id="inputWrap_device">
          <input type="file" id="inputDeviceFile" accept="image/*" class="form-control" />
        </div>
        <div id="inputWrap_camera" style="display: none;">
          <input type="file" id="inputCameraFile" accept="image/*" capture="environment" class="form-control" />
        </div>
        <div id="inputWrap_cloud" style="display: none;">
          <input type="url" id="inputCloudUrl" placeholder="https://example.com/image.jpg" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label>Add Personal Note</label>
        <textarea id="modalNote" class="form-control" rows="3" placeholder="Write memories, dates, thoughts..."></textarea>
      </div>

      <button id="btnSaveMemory" class="btn-submit" onclick="saveNewPhoto()">Save to Gallery</button>
      <button class="btn-close" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div id="lightboxModal">
    <img id="lightboxImg" src="" alt="Preview" />
    <div class="lightbox-details">
      <div id="lightboxTag" class="photo-tag"></div>
      <p id="lightboxNote" style="margin-top: 6px; color: #f1f7f9; font-size: 0.95rem;"></p>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 16px;">
        <button class="btn-logout" style="padding: 8px 16px; font-size: 0.85rem;" onclick="deleteCurrentPhoto()">Delete Photo</button>
        <button class="btn-close" style="width: auto; padding: 8px 16px; margin: 0;" onclick="closeLightbox()">Close</button>
      </div>
    </div>
  </div>

</body>
</html>
